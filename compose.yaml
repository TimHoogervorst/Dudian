services:
  reader:
    build: .
    ports:
      - "3000:3000"
      - "127.0.0.1:14551:14551"
    environment:
      DATA_DIR: /data
      SIWC_BIND: 0.0.0.0
      DUDIAN_COVER_JOBS: /cover-jobs
    volumes:
      - reader-data:/data
      - ./.work/cover-jobs:/cover-jobs
volumes:
  reader-data: {}
